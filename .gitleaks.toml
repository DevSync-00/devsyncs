title = "DevSync gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore build artifacts and dependency trees"
paths = [
  '''node_modules''',
  '''(^|/)\.tmp-npm-cache/''',
  '''(^|/)\.tmp/''',
  '''(^|/)\.devsync-projects/''',
  '''(^|/)\.vscode-test/''',
  '''(^|/)\.env\.local$''',
  '''\.next/''',
  '''/out/''',
  '''/dist/''',
  '''package-lock\.json''',
  '''\.min\.js$''',
]
